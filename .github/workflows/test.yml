name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/**/*.test.js"
      - name: Run the action on its own demo fixture (bundled rules, no issue)
        uses: ./
        with:
          paths: test/fixtures/demo-repo
          ignore: node_modules
          rules-url: dist/rules-snapshot.json
          create-issue: 'false'
